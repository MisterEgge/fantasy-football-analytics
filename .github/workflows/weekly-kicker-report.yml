name: Weekly fantasy kicker report

on:
  workflow_dispatch:
  schedule:
    # Wednesday 3 PM Central: CDT=20:00 UTC; CST=21:00 UTC
    - cron: '0 20 * * 3'
    - cron: '0 21 * * 3'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Central-time schedule
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$SCHEDULE" == "0 20 * * 3" && "$(TZ=America/Chicago date +%Z)" == "CDT" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$SCHEDULE" == "0 21 * * 3" && "$(TZ=America/Chicago date +%Z)" == "CST" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the alternate UTC cron expression."
          fi
      - name: Set up Python
        if: steps.clock.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        if: steps.clock.outputs.run == 'true'
        run: python -m pip install -r requirements.txt
      - name: Test
        if: steps.clock.outputs.run == 'true'
        run: python -m pytest -q
      - name: Generate weekly report
        if: steps.clock.outputs.run == 'true'
        run: python -m kicker_tracker.cli --season "$(TZ=America/Chicago date +%Y)" --as-of "$(TZ=America/Chicago date +%F)"
      - name: Upload HTML and JSON reports
        if: steps.clock.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kicker-report-${{ github.run_number }}
          path: report/
          retention-days: 90
      - name: Email report
        if: steps.clock.outputs.run == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python -m kicker_tracker.emailer report/latest.html
