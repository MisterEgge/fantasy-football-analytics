name: Weekly fantasy kicker report

on:
  workflow_dispatch:
  schedule:
    # Wednesday 3 PM Central: CDT=20:00 UTC; CST=21:00 UTC
    - cron: '0 20 * * 3'
    - cron: '0 21 * * 3'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: fantasy-history-updates
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout forecast history
        if: always()
        uses: actions/checkout@v4
        with:
          ref: forecast-history
          path: history-store
      - name: Verify Central-time schedule
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$SCHEDULE" == "0 20 * * 3" && "$(TZ=America/Chicago date +%Z)" == "CDT" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$SCHEDULE" == "0 21 * * 3" && "$(TZ=America/Chicago date +%Z)" == "CST" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the alternate UTC cron expression."
          fi
      - name: Set up Python
        if: steps.clock.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        if: steps.clock.outputs.run == 'true'
        run: python -m pip install -r requirements.txt
      - name: Test
        if: steps.clock.outputs.run == 'true'
        run: python -m pytest -q tests
      - name: Generate weekly report
        if: steps.clock.outputs.run == 'true'
        run: python -m kicker_tracker.cli --season "$(TZ=America/Chicago date +%Y)" --as-of "$(TZ=America/Chicago date +%F)" --history-dir history-store
      - name: Archive immutable pregame predictions
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          season=$(python -c 'import json; print(json.load(open("report/latest.json"))["metadata"]["season"])')
          week=$(python -c 'import json; print("%02d" % json.load(open("report/latest.json"))["metadata"]["target_week"])')
          target="history-store/forecasts/${season}/week_${week}.json"
          if [[ -f "$target" ]]; then
            echo "Archived forecast already exists; reusing the immutable forecast for this email."
            cp "$target" report/latest.json
            python -c 'import json; from pathlib import Path; from kicker_tracker.report import build_html; s=json.loads(Path("report/latest.json").read_text()); Path("report/latest.html").write_text(build_html(s["teams"],s["metadata"]),encoding="utf-8")'
            exit 0
          fi
          if [[ "$(TZ=America/Chicago date +%u)" != "3" ]]; then
            echo "Manual preview outside Wednesday: not saving a pregame forecast."
            exit 0
          fi
          mkdir -p "$(dirname "$target")"
          cp report/latest.json "$target"
          git -C history-store config user.name "github-actions[bot]"
          git -C history-store config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C history-store add "forecasts/${season}/week_${week}.json"
          git -C history-store commit -m "Archive immutable ${season} Week ${week} pregame forecast"
          git -C history-store push origin HEAD:forecast-history
      - name: Upload HTML and JSON reports
        if: steps.clock.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kicker-report-${{ github.run_number }}
          path: report/
          retention-days: 90
      - name: Email report
        if: steps.clock.outputs.run == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m kicker_tracker.emailer report/latest.html
