name: Tuesday defense forecast review

on:
  workflow_dispatch:
  schedule:
    # Tuesday 3:20 PM America/Chicago.
    - cron: '20 20 * * 2'
    - cron: '20 21 * * 2'

permissions:
  contents: write

concurrency:
  group: fantasy-history-updates
  cancel-in-progress: false

jobs:
  defense-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check out prediction archive
        uses: actions/checkout@v4
        with:
          ref: forecast-history
          path: history-store
      - name: Determine if correct Central-time cron
        id: clock
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ||
                ( "$CRON" == "20 20 * * 2" && "$(TZ=America/Chicago date +%Z)" == "CDT" ) ||
                ( "$CRON" == "20 21 * * 2" && "$(TZ=America/Chicago date +%Z)" == "CST" ) ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.clock.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install requirements
        if: steps.clock.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Test
        if: steps.clock.outputs.run == 'true'
        run: pytest -q
      - name: Grade archived D/ST forecasts against completed games
        if: steps.clock.outputs.run == 'true'
        run: python -m defense_tracker.review --history-dir history-store --season "$(TZ=America/Chicago date +%Y)" --as-of "$(TZ=America/Chicago date +%F)"
      - name: Check review produced
        id: ready
        if: steps.clock.outputs.run == 'true'
        run: |
          if [[ -f defense-review/latest.json ]]; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi
      - name: Archive Tuesday review for future calibration
        if: steps.ready.outputs.yes == 'true'
        run: |
          set -euo pipefail
          season=$(python -c 'import json; print(json.load(open("defense-review/latest.json"))["metadata"]["season"])')
          week=$(python -c 'import json; print("%02d" % json.load(open("defense-review/latest.json"))["metadata"]["week"])')
          target="history-store/defense-reviews/${season}/week_${week}.json"
          if [[ -f "$target" ]]; then
            echo "::error::Review already archived: refusing overwrite."
            exit 1
          fi
          mkdir -p "$(dirname "$target")"
          cp defense-review/latest.json "$target"
          cp defense-review/latest.html "history-store/defense-reviews/${season}/week_${week}.html"
          git -C history-store config user.name "github-actions[bot]"
          git -C history-store config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C history-store add "defense-reviews/${season}/"
          git -C history-store commit -m "Grade ${season} Week ${week} defense forecasts"
          git -C history-store push origin HEAD:forecast-history
      - name: Upload review report
        if: steps.ready.outputs.yes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: defense-review-${{ github.run_number }}
          path: defense-review/
          retention-days: 90
      - name: Email Tuesday defense review
        if: steps.ready.outputs.yes == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m kicker_tracker.emailer defense-review/latest.html
